<!doctype html>
<html lang="pl" data-prototype-id="stary">
<head>
<meta charset="utf-8">
<title>Stary prototyp</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="screens.css">
<link rel="stylesheet" href="prototype.css">
</head>
<body>
<div class="doc">
<section class="screen" id="s1" data-prototype-example>
  <div class="frame"><button type="button">Przykład</button></div>
</section>

<!-- s2: sciezki jednoznaczne, wszystkie elementy z jawnymi znacznikami konca -->
<section class="screen" id="s2">
  <div class="frame">
    <main>
      <h1>Rekordy</h1>
      <div>
        <button type="button"><span>Zapisz</span></button>
      </div>
    </main>
  </div>
</section>

<!-- Ramki s3-s5 i s7 maja data-proto-id, wiec o wyniku lost decyduje wylacznie niejednoznacznosc sciezki, nie brak uchwytu.
     s3: tabela bez tbody; DOM przegladarki dodaje tbody, wiec sciezka v1 nie jest jednoznaczna -->
<section class="screen" id="s3">
  <div class="frame" data-proto-id="s3-ramka">
    <table>
      <tr><th>Imie</th></tr>
      <tr><td>Ala</td></tr>
    </table>
  </div>
</section>

<!-- s4: lista bez znacznikow konca li -->
<section class="screen" id="s4">
  <div class="frame" data-proto-id="s4-ramka">
    <ul>
      <li>Pierwszy
      <li>Drugi
    </ul>
  </div>
</section>

<!-- s5: akapity bez znacznikow konca -->
<section class="screen" id="s5">
  <div class="frame" data-proto-id="s5-ramka">
    <p>Pierwszy akapit
    <p>Drugi akapit
  </div>
</section>

<!-- s6: ekran bez komentarza zakotwiczonego pozycyjnie (pusta kotwica) -->
<section class="screen" id="s6">
  <div class="frame"><a href="#s2">Dalej</a></div>
</section>

<!-- s7: blad zagniezdzenia: znaczniki konca w zlej kolejnosci -->
<section class="screen" id="s7">
  <div class="frame" data-proto-id="s7-ramka"><div><span>Tekst</div></span></div>
</section>
</div>
<script src="comments.js"></script>
<script src="prototype.js"></script>
</body>
</html>
