# Indeks narzędzi biblioteki. Schemat: schema 1, rekord = jedno narzędzie z własnym usage i selftest.
# `path` jest względem korzenia warstwy (library/ rdzenia); `files` to wzorce ścieżek projektu dla `route --files` (w rdzeniu pusta lista);
# `usage` i `selftest` są pisane tak, jakby katalogiem roboczym był katalog skryptu.
schema: 1
tools:
- id: ui-parity-measure
  path: skills/ui-verify/scripts/measure.mjs
  purpose: Pomiar parytetu elementów UI (pudełko, kolory, font) wzorzec kontra kandydat, z kontrolą kształtu przez wycięty pixel diff.
  topics:
  - ui
  - parytet
  - pomiar
  - playwright
  - pixel-diff
  usage: node measure.mjs --config <plik.json> <outDir>
  selftest: node measure.mjs --selftest
  files: []
  limits:
  - Wymaga Chrome i zależności z cache (install.mjs); selftest czystej logiki działa bez nich. Kody 0 PASS, 1 FAIL, 2 błąd, 3 brak środowiska lub UNVERIFIED.
  status: active
  supersedes: []
  origin: Rdzeń Skillsync, skill ui-verify (inwentarz narzędzi weryfikacji UI).
- id: ui-pixel-diff
  path: skills/ui-verify/scripts/pixel-diff.mjs
  purpose: Porównanie dwóch PNG (pixelmatch) z odpornością na przesunięcie o 1 px, maskami, progiem procentowym i jawną odmową dla różnych wymiarów.
  topics:
  - ui
  - pixel-diff
  - png
  - regresja-wizualna
  usage: node pixel-diff.mjs [--max-pct <n>] [--mask <x,y,w,h>] [--crop] [--diff-out <plik>] [--json] <wzorzec.png> <kandydat.png>
  selftest: node pixel-diff.mjs --selftest
  files: []
  limits:
  - Wymaga pngjs i pixelmatch z cache (install.mjs); selftest bez nich zwraca 3 dla przypadków z PNG. Bez Chrome.
  status: active
  supersedes: []
  origin: Rdzeń Skillsync, skill ui-verify.
- id: ui-a11y
  path: skills/ui-verify/scripts/a11y.mjs
  purpose: Audyt dostępności strony z jawnymi werdyktami, kontrast z renderowanych pikseli, rozmiar celów WCAG 2.5.8, fokus z klawiatury, kolejność Tab i konsola, z wyjątkami i ręcznymi potwierdzeniami z terminem.
  topics:
  - ui
  - a11y
  - wcag
  - kontrast
  - fokus
  - tab
  - konsola
  - playwright
  usage: node a11y.mjs --config <plik.json> <outDir>
  selftest: node a11y.mjs --selftest
  files: []
  limits:
  - Wymaga Chrome i zależności z cache (install.mjs); selftest czystej logiki działa bez nich.
  - Kody 0 PASS, 1 FAIL, 2 błąd, 3 UNVERIFIED albo brak środowiska; UNVERIFIED nigdy nie daje kodu 0.
  - Wyjątki i potwierdzenia z pliku projektu wymagają reason, a potwierdzenia także checkedBy i terminu; limity i przyczyny pomiarowe bez ścieżki wyjątku.
  - Granice pomiaru, np. zamknięty shadow DOM i iframe z innego originu nie są audytowane; kontrast elementów nietekstowych jest poza v1.
  status: active
  supersedes: []
  origin: Rdzeń Skillsync, skill ui-verify, polecenie a11y.
- id: ui-capture
  path: skills/ui-verify/scripts/capture.mjs
  purpose: Zrzuty macierzy stron, szerokości i trybów kolorów z maskami elementów zmiennych i asercją pozytywną (strona pokazała oczekiwany element).
  topics:
  - ui
  - zrzuty
  - playwright
  - regresja-wizualna
  usage: node capture.mjs [--allow-origin <wzorzec>] [--allow-trace] --config <plik.json> <outDir>
  selftest: node capture.mjs --selftest
  files: []
  limits:
  - Wymaga Chrome i zależności z cache; logowanie tylko ze zmiennych środowiska; trace i storageState tylko z --allow-trace; strona bez asercji daje UNVERIFIED (kod 3).
  status: active
  supersedes: []
  origin: Rdzeń Skillsync, skill ui-verify.
- id: ui-diff
  path: skills/ui-verify/scripts/diff.mjs
  purpose: Porównanie dwóch katalogów zrzutów z capture; SAME tylko gdy oba zrzuty mają asercję pozytywną PASS, inaczej UNVERIFIED.
  topics:
  - ui
  - zrzuty
  - regresja-wizualna
  - diff
  usage: node diff.mjs [--max-pct <n>] [--json] <przed> <po>
  selftest: node diff.mjs --selftest
  files: []
  limits:
  - Wymaga pngjs i pixelmatch z cache; domyślny próg 0 (SAME = identyczne); brak manifestu daje UNVERIFIED.
  status: active
  supersedes: []
  origin: Rdzeń Skillsync, skill ui-verify.
- id: db-snapshot
  path: skills/test-env/scripts/db_snapshot.py
  purpose: 'Migawka lokalnej bazy SQL Server przed zapisem testowym (COPY_ONLY, weryfikacja, sidecar) i cofnięcie z kontrolami tożsamości; odmowy kodem 2 przed zmianą bazy.'
  topics:
  - baza
  - sql-server
  - kopia
  - cofniecie
  - sqlcmd
  - test-env
  usage: 'python3 db_snapshot.py backup --database <baza> --label <etykieta> [--server <serwer>] [--dir <katalog>] [--dry-run] [--json] | python3 db_snapshot.py restore --file <plik.bak> --database <baza> --confirm <baza> [--server <serwer>] [--dir <katalog>] [--dry-run] [--json]'
  selftest: python3 db_snapshot.py --selftest
  files: []
  limits:
  - 'Wymaga Pythona 3.11+ i sqlcmd w PATH; selftest działa bez bazy i bez sqlcmd (atrapy w pamięci). Kody 0 PASS; 1 FAIL po rozpoczęciu zmiany (BACKUP, ALTER, RESTORE; stan bazy mógł się zmienić); 2 BLOCKED (odmowa albo błąd przed pierwszą zmianą; baza nietknięta); 3 NOT_RUN (dry-run, brak sqlcmd).'
  - 'Niezweryfikowane na silniku: test na żywo (S7) nie został wykonany; zachowanie prawdziwego SQL Servera opisuje lista kontrolna w references/db-snapshot.md.'
  - 'restore tylko na lokalnym silniku; zdalny host tylko dla backup z jawnym --allow-host, --dir i --server-os. Nie odtwarza skasowanej bazy; obsługuje pojedynczy pełny zestaw kopii; nie usuwa plików .bak.'
  status: active
  supersedes: []
  origin: 'Rdzeń Skillsync, skill test-env (migawka bazy SQL Server przed zapisem testowym).'
- id: prototype-theme-check
  path: skills/prototype/scripts/theme_check.py
  purpose: 'Kontrola motywu prototypów w projekcie z konfiguracji JSON, bez zapisu: tokeny, bloki ciemne, zakazane konstrukcje, kopie, kontrast WCAG (także oklch, oklab, lab, lch) i reguły stylu prototypów; UNVERIFIED zamiast cichego PASS.'
  topics:
  - prototyp
  - motyw
  - tokeny
  - kontrast
  - css
  - dark
  - wcag
  usage: 'python3 theme_check.py --config <plik.json | -> [--project <katalog>] [--skill-root <katalog>] [--only <kontrola>[,...]] [--json]'
  selftest: python3 theme_check.py --selftest
  files: []
  limits:
  - 'Wymaga Pythona 3.11+, tylko biblioteka standardowa. Kody 0 PASS (także same WARN), 1 FAIL, 2 błąd wywołania albo konfiguracji, 3 UNVERIFIED bez FAIL.'
  - 'Formaty koloru spoza listy (color(), color-mix(), hwb(), nazwane kolory, calc()) i cykle aliasów to UNVERIFIED, nie PASS; pliki CSS i HTML powyżej 2 MiB oraz zagnieżdżenie powyżej 200 poziomów to kod 2.'
  - 'Nie sprawdza wyrenderowanej strony, tylko źródła CSS i HTML; skrypt niczego nie zapisuje.'
  status: active
  supersedes: []
  origin: 'Rdzeń Skillsync, skill prototype (kontrola motywu prototypów, CORE-1140-T4).'
