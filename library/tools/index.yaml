# Indeks narzędzi biblioteki. Schemat: schema 1, rekord = jedno narzędzie z własnym usage i selftest.
# `path` jest względem korzenia warstwy (library/ rdzenia); `files` to wzorce ścieżek projektu dla `route --files` (w rdzeniu pusta lista);
# `usage` i `selftest` są pisane tak, jakby katalogiem roboczym był katalog skryptu.
schema: 1
tools:
- id: ui-parity-measure
  path: skills/ui-verify/scripts/measure.mjs
  purpose: Pomiar parytetu elementów UI (pudełko, kolory, font) wzorzec kontra kandydat, z kontrolą kształtu przez wycięty pixel diff.
  topics:
  - ui
  - parytet
  - pomiar
  - playwright
  - pixel-diff
  usage: node measure.mjs --config <plik.json> <outDir>
  selftest: node measure.mjs --selftest
  files: []
  limits:
  - Wymaga Chrome i zależności z cache (install.mjs); selftest czystej logiki działa bez nich. Kody 0 PASS, 1 FAIL, 2 błąd, 3 brak środowiska lub UNVERIFIED.
  - Odmawia kodem 2 PNG powyżej limitów (bufor ponad 64 MiB, ponad 16384 px na bok albo ponad 50 Mpx, przeplot Adam7, uszkodzona paleta, ponad 100000 chunków).
  status: active
  supersedes: []
  origin: Rdzeń Skillsync, skill ui-verify (inwentarz narzędzi weryfikacji UI).
- id: ui-pixel-diff
  path: skills/ui-verify/scripts/pixel-diff.mjs
  purpose: Porównanie dwóch PNG (pixelmatch) z odpornością na przesunięcie o 1 px, maskami, progiem procentowym i jawną odmową dla różnych wymiarów.
  topics:
  - ui
  - pixel-diff
  - png
  - regresja-wizualna
  usage: node pixel-diff.mjs [--max-pct <n>] [--mask <x,y,w,h>] [--crop] [--diff-out <plik>] [--json] <wzorzec.png> <kandydat.png>
  selftest: node pixel-diff.mjs --selftest
  files: []
  limits:
  - Wymaga pngjs i pixelmatch z cache (install.mjs); selftest bez nich zwraca 3 dla przypadków z PNG. Bez Chrome.
  - Odmawia kodem 2 PNG powyżej limitów (bufor ponad 64 MiB, ponad 16384 px na bok albo ponad 50 Mpx, przeplot Adam7, uszkodzona paleta, ponad 100000 chunków); plik wejściowy musi być zwykłym plikiem w limicie rozmiaru.
  status: active
  supersedes: []
  origin: Rdzeń Skillsync, skill ui-verify.
- id: ui-a11y
  path: skills/ui-verify/scripts/a11y.mjs
  purpose: Audyt dostępności strony z jawnymi werdyktami, kontrast z renderowanych pikseli, rozmiar celów WCAG 2.5.8, fokus z klawiatury, opcjonalny kontrast wskaźnika fokusu (WCAG 1.4.11 i 2.4.13), opcjonalny kontrast komponentów i ikon nietekstowych (WCAG 1.4.11, kontrola non-text), kolejność Tab i konsola, z wyjątkami i ręcznymi potwierdzeniami z terminem.
  topics:
  - ui
  - a11y
  - wcag
  - kontrast
  - fokus
  - tab
  - konsola
  - playwright
  usage: node a11y.mjs --config <plik.json> <outDir>
  selftest: node a11y.mjs --selftest
  files: []
  limits:
  - Wymaga Chrome i zależności z cache (install.mjs); selftest czystej logiki działa bez nich.
  - Kody 0 PASS, 1 FAIL, 2 błąd, 3 UNVERIFIED albo brak środowiska; UNVERIFIED nigdy nie daje kodu 0.
  - Wyjątki i potwierdzenia z pliku projektu wymagają reason, a potwierdzenia także checkedBy i terminu; limity i przyczyny pomiarowe bez ścieżki wyjątku.
  - Granice pomiaru, np. zamknięty shadow DOM i iframe z innego originu nie są audytowane; kontrast komponentów i ikon (non-text) jest opt-in z prostokątnym pasmem i pierścieniem (zaokrąglona kontrolka, która nie przechodzi, jest UNVERIFIED), a kontrast wskaźnika fokusu jest opt-in (focus.contrast, focus.appearance).
  - Zrzuty kontrastu przechodzą przez dekoder z limitami PNG (kod 2 przy odmowie); stronę tnie na kawałki do 16000 px, a większą zgłasza jako page-too-tall (UNVERIFIED).
  status: active
  supersedes: []
  origin: Rdzeń Skillsync, skill ui-verify, polecenie a11y.
- id: ui-capture
  path: skills/ui-verify/scripts/capture.mjs
  purpose: Zrzuty macierzy stron, szerokości i trybów kolorów z maskami elementów zmiennych i asercją pozytywną (strona pokazała oczekiwany element).
  topics:
  - ui
  - zrzuty
  - playwright
  - regresja-wizualna
  usage: node capture.mjs [--allow-origin <wzorzec>] [--allow-trace] --config <plik.json> <outDir>
  selftest: node capture.mjs --selftest
  files: []
  limits:
  - Wymaga Chrome i zależności z cache; logowanie tylko ze zmiennych środowiska; trace i storageState tylko z --allow-trace; strona bez asercji daje UNVERIFIED (kod 3).
  - Zrzut ponad limitami PNG (ponad 16384 px na bok albo ponad 50 Mpx, np. fullPage bardzo długiej strony) kończy się kodem 2; z --allow-trace pliki trace.zip i storageState.json mają tryb 0600 (POSIX), capture zakłada <outDir>/.gitignore z nimi (gdy go nie ma), a maska wyjścia ich nie obejmuje (trace może zawierać hasła, ciasteczka, nagłówki i klatki ekranu).
  status: active
  supersedes: []
  origin: Rdzeń Skillsync, skill ui-verify.
- id: ui-diff
  path: skills/ui-verify/scripts/diff.mjs
  purpose: Porównanie dwóch katalogów zrzutów z capture; SAME tylko gdy oba zrzuty mają asercję pozytywną PASS, inaczej UNVERIFIED.
  topics:
  - ui
  - zrzuty
  - regresja-wizualna
  - diff
  usage: node diff.mjs [--max-pct <n>] [--json] <przed> <po>
  selftest: node diff.mjs --selftest
  files: []
  limits:
  - Wymaga pngjs i pixelmatch z cache; domyślny próg 0 (SAME = identyczne); brak manifestu daje UNVERIFIED.
  - Odmawia kodem 2 (jako błąd odczytu, nie UNVERIFIED) PNG powyżej limitów (bufor ponad 64 MiB, ponad 16384 px na bok albo ponad 50 Mpx, przeplot Adam7, uszkodzona paleta, ponad 100000 chunków); plik musi być zwykłym plikiem w limicie rozmiaru.
  status: active
  supersedes: []
  origin: Rdzeń Skillsync, skill ui-verify.
- id: db-snapshot
  path: skills/test-env/scripts/db_snapshot.py
  purpose: 'Migawka lokalnej bazy SQL Server przed zapisem testowym (COPY_ONLY, weryfikacja, sidecar) i cofnięcie z kontrolami tożsamości (także na istniejącą bazę z plikami w innych ścieżkach: restore --move existing, albo utworzenie bazy, której nie ma: restore --move new [--move-dir]); odmowy kodem 2 przed zmianą bazy.'
  topics:
  - baza
  - sql-server
  - kopia
  - cofniecie
  - sqlcmd
  - test-env
  usage: 'python3 db_snapshot.py backup --database <baza> --label <etykieta> [--server <serwer>] [--dir <katalog>] [--sha256] [--dry-run] [--json] | python3 db_snapshot.py restore --file <plik.bak> --database <baza> --confirm <baza> [--server <serwer>] [--dir <katalog>] [--no-safety-backup] [--allow-missing-sidecar] [--move none|existing|new] [--move-dir <katalog, tylko z --move new>] [--dry-run] [--json] (restore --dry-run też wymaga --confirm; --sha256 zapisuje skrót w pliku pomocniczym kopii, --allow-missing-sidecar pozwala przywrócić kopię bez niego) | python3 db_snapshot.py prune --database <baza> --confirm <baza> [--label <etykieta>] [--keep N] [--older-than-days D] [--dir <katalog>] [--dry-run] [--json] | python3 db_snapshot.py verify --file <plik.bak> [--database <baza>] [--dir <katalog>] [--offline] [--allow-missing-sidecar] [--server <serwer>] [--timeout <sekundy>] [--dry-run] [--json]'
  selftest: python3 db_snapshot.py --selftest
  files: []
  limits:
  - 'Wymaga Pythona 3.11+ i sqlcmd w PATH; selftest działa bez bazy i bez sqlcmd (atrapy w pamięci). Kody 0 PASS; 1 FAIL po rozpoczęciu zmiany (BACKUP, ALTER, RESTORE; stan bazy mógł się zmienić); 2 BLOCKED (odmowa albo błąd przed pierwszą zmianą; baza nietknięta); 3 NOT_RUN (dry-run, brak sqlcmd). prune ma własne kody: 1 po usunięciu pliku i błędzie lub przerwaniu, 2 gdy nic nie usunięto (katalog bez zmian). verify niczego nie zmienia i ma własne kody: 0 wszystkie kontrole przeszły; 1 kopia uszkodzona lub niezgodna z plikiem pomocniczym (rozmiar, SHA-256, nagłówek, VERIFYONLY); 2 nie dało się sprawdzić (reguła, brak pliku lub pliku pomocniczego, --offline bez pliku pomocniczego, silnik nie odpowiada); 3 dry-run lub brak sqlcmd (z --offline silnik nie jest potrzebny).'
  - 'Zweryfikowane na SQL Server LocalDB 2019 (Windows, sqlcmd 15.0, ODBC 17, uwierzytelnianie zintegrowane); niezweryfikowane: pełne instancje, Linux/kontener, go-sqlcmd, --auth env z logowaniem SQL, zdalny backup, -C, stabilność tożsamości LocalDB po restarcie; wyniki w references/db-snapshot.md.'
  - 'restore tylko na lokalnym silniku; zdalny host tylko dla backup z jawnym --allow-host, --dir i --server-os. Bez --move restore wymaga istniejącej bazy i używa ścieżek z kopii; --move existing|new (--move-dir tylko z new, katalog musi istnieć, ścieżki ASCII z whitelisty) nie obsługuje plików FILESTREAM ani pamięci operacyjnej i nie zmienia nazwy bazy; test nowego kodu --move na żywo (K8(b)) NOT_RUN; obsługuje pojedynczy pełny zestaw kopii; stare kopie usuwa tylko ręczny prune (lokalne pliki tego narzędzia z lokalnym sidecarem, --confirm, bez kontaktu z silnikiem).'
  status: active
  supersedes: []
  origin: 'Rdzeń Skillsync, skill test-env (migawka bazy SQL Server przed zapisem testowym).'
- id: prototype-theme-check
  path: skills/prototype/scripts/theme_check.py
  purpose: 'Kontrola motywu prototypów w projekcie z konfiguracji JSON, bez zapisu: tokeny, bloki ciemne, zakazane konstrukcje, kopie, kontrast WCAG (także oklch, oklab, lab, lch) i reguły stylu prototypów; UNVERIFIED zamiast cichego PASS.'
  topics:
  - prototyp
  - motyw
  - tokeny
  - kontrast
  - css
  - dark
  - wcag
  usage: 'python3 theme_check.py --config <plik.json | -> [--project <katalog>] [--skill-root <katalog>] [--only <kontrola>[,...]] [--json]'
  selftest: python3 theme_check.py --selftest
  files: []
  limits:
  - 'Wymaga Pythona 3.11+, tylko biblioteka standardowa. Kody 0 PASS (także same WARN), 1 FAIL, 2 błąd wywołania albo konfiguracji, 3 UNVERIFIED bez FAIL.'
  - 'Formaty koloru spoza listy (color(), color-mix(), hwb(), nazwane kolory, calc()) i cykle aliasów to UNVERIFIED, nie PASS; pliki CSS i HTML powyżej 2 MiB oraz zagnieżdżenie powyżej 200 poziomów to kod 2.'
  - 'Nie sprawdza wyrenderowanej strony, tylko źródła CSS i HTML; skrypt niczego nie zapisuje w projekcie (selftest używa katalogów tymczasowych).'
  status: active
  supersedes: []
  origin: 'Rdzeń Skillsync, skill prototype (kontrola motywu prototypów, CORE-1140-T4).'
- id: css-scope-run
  path: skills/ui-verify/scripts/css-scope.mjs
  purpose: 'Jedno polecenie dla nakładki CSS: kompilacja SCSS starym silnikiem LibSass (sass.js), kontrola, że każdy selektor leży pod klasą korzenia albo pod nazwanym wyjątkiem, licznik !important i kontrola
    „nic nie usunięte” względem buildu bez nakładki.'
  topics:
  - css
  - scss
  - libsass
  - nakladka
  - zakres-selektorow
  usage: node css-scope.mjs run --config <plik.json> [--scss-dir <katalog>] [--entry <plik.scss>] [--without <plik.scss>] [--out <wynik.css>] [--json]
  selftest: node css-scope.mjs --selftest
  files: []
  limits:
  - Kompilacja wymaga sass.js 0.11.1 z cache (install.mjs); bez niego kod 3, a selftest i kontrole gotowych CSS działają.
  - LibSass 3.6 przez sass.js odtwarza silnik starego buildu gulp-sass 4, ale nim nie jest; !important jest liczony, nie oceniany.
  - Kody 0 PASS, 1 FAIL, 2 błąd użycia lub konfiguracji, 3 NOT_RUN.
  status: active
  supersedes: []
  origin: Rdzeń Skillsync, skill ui-verify (polecenie css-scope).
- id: css-scope-check
  path: skills/ui-verify/scripts/css-scope.mjs
  purpose: 'Kontrola zakresu gotowego CSS: każdy selektor pod klasą korzenia albo pod wyjątkiem z danych (prefiks, alias korzenia, dokładna reguła), licznik reguł i !important.'
  topics:
  - css
  - zakres-selektorow
  - nakladka
  usage: node css-scope.mjs check (--config <plik.json> | --root <.klasa>) <plik.css> [--json]
  selftest: node css-scope.mjs selftest [--config <plik.json>]
  files: []
  limits:
  - Parser CSS własny (komentarze, napisy, grupy @media/@supports, @keyframes, @font-face); błąd rozbioru daje kod 2 z numerem linii.
  - Bez sieci i bez sass.js.
  status: active
  supersedes: []
  origin: Rdzeń Skillsync, skill ui-verify (polecenie css-scope).
- id: css-scope-diff
  path: skills/ui-verify/scripts/css-scope.mjs
  purpose: 'Różnica „nic nie usunięte”: dwa CSS (z nakładką i bez) porównane po krotnościach reguł; dodane tylko pod korzeniem, @font-face albo wyjątkiem.'
  topics:
  - css
  - nakladka
  - regresja
  - diff
  usage: node css-scope.mjs diff --config <plik.json> <z.css> <bez.css> [--json]
  selftest: node css-scope.mjs --selftest
  files: []
  limits:
  - Dodana reguła jest oceniana tak samo jak w check (korzeń, prefiks, alias z onlyPropertyPrefix, exact-rule); reguła z zagnieżdżeniem to dodanie poza zakresem.
  - Zmieniona reguła to jedno usunięte i jedno dodane (FAIL).
  status: active
  supersedes: []
  origin: Rdzeń Skillsync, skill ui-verify (polecenie css-scope).
- id: css-scope-compile
  path: skills/ui-verify/scripts/css-scope.mjs
  purpose: Kompilacja SCSS starym silnikiem LibSass (sass.js 0.11.1) do CSS w stylu expanded; zapis pod --out (względem bieżącego katalogu).
  topics:
  - css
  - scss
  - libsass
  - kompilacja
  usage: node css-scope.mjs compile --config <plik.json> [--scss-dir <katalog>] [--entry <plik.scss>] [--out <wynik.css>]
  selftest: node css-scope.mjs --selftest
  files: []
  limits:
  - Wymaga sass.js z cache (kod 3 bez niego); katalog SCSS pierwszego poziomu, limity 500 plików i 2 MB na plik.
  - Błąd kompilacji SCSS to FAIL (kod 1), nie błąd narzędzia.
  status: active
  supersedes: []
  origin: Rdzeń Skillsync, skill ui-verify (polecenie css-scope).
