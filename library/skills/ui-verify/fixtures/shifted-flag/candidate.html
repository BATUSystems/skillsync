<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>shifted-flag candidate</title>
<style>
html,body{margin:0;background:#fff}
.stage{padding:12px;width:64px;height:20px}
.pill{box-sizing:border-box;position:relative;display:block;width:64px;height:20px;border:1px solid #9aa3b2;border-radius:10px;background:#e6e9ef;font:11px/18px Arial,Helvetica,sans-serif;color:#3b4252}
.disc{position:absolute;top:2px;left:-1px;width:14px;height:14px;border-radius:50%;background:linear-gradient(90deg,#2f6f9f 50%,#d9a441 50%)}
.code{position:absolute;top:0;left:27px;letter-spacing:.5px}
.chev{position:absolute;top:5px;left:48px;width:5px;height:5px;border-right:1.5px solid #3b4252;border-bottom:1.5px solid #3b4252;transform:rotate(45deg)}
</style></head><body>
<div class="stage"><span class="pill" id="target"><span class="disc"></span><span class="code">EN</span><span class="chev"></span></span></div>
</body></html>
