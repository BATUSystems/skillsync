<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>near-identical candidate</title>
<style>
html,body{margin:0;background:#fff}
.stage{padding:12px}
.row{display:flex;gap:8px;width:142px;height:20px}
.pill{box-sizing:border-box;position:relative;width:42px;height:20px;border:1px solid #9aa3b2;border-radius:10px;background:#e6e9ef}
.pill:nth-child(2){background:#dfe8e2}
.pill:nth-child(3){background:#efe6e6}
.edge{position:absolute;top:-1px;left:19px;width:1px;height:1px;background:#5a6475}
</style></head><body>
<div class="stage"><div class="row" id="target"><span class="pill"><i class="edge"></i></span><span class="pill"></span><span class="pill"></span></div></div>
</body></html>
