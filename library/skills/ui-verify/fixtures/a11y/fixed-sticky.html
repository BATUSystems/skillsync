<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>a11y fixed and sticky</title>
<style>
html,body{margin:0;background:#fff;color:#1a1a1a;font:16px/1.4 Arial,Helvetica,sans-serif}
#fixed{position:fixed;top:0;left:0;width:100%;height:60px;background:#101820;color:#f5f5f5;line-height:60px;padding-left:16px;box-sizing:border-box}
main{padding-top:120px;height:3000px}
#sticky{position:sticky;top:0;width:360px;height:40px;line-height:40px;background:#101820;color:#f5f5f5;padding-left:16px;margin-top:700px}
#below{margin-top:400px}
</style></head><body>
<div id="fixed"><span id="fixed-text">Fixed header measured at the start position</span></div>
<main>
<p>Content under the fixed header.</p>
<div id="sticky"><span id="sticky-text">Sticky bar measured at its natural place</span></div>
<p id="below">Plain text below</p>
</main>
</body></html>
