<!doctype html>
<html lang="ar"><head><meta charset="utf-8"><title>a11y rtl</title>
<style>
html,body{margin:0;background:#fff;color:#1a1a1a;font:16px/1.4 Arial,Helvetica,sans-serif}
main{padding:16px}
.row{display:flex;gap:16px}
button{font:inherit;color:#111;background:#e8e8e8;border:1px solid #666;padding:8px 16px;min-width:48px}
button:focus-visible{outline:3px solid #005fcc;outline-offset:2px}
</style></head><body dir="rtl">
<main><div class="row"><button id="first" type="button">One</button><button id="second" type="button">Two</button><button id="third" type="button">Three</button></div></main>
</body></html>
