<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>a11y tall</title>
<style>

<main>
<p class="abs" id="top-ok">Top of a tall page</p>
<div class="abs" id="band"></div>
<p class="abs" id="dark-ok">Light text on a dark band far below the first screen</p>
<p class="abs" id="low-fail">Pale text low on the page</p>
</main>
</body></html>
