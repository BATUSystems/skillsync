<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>a11y background-clip text</title>
<style>
html,body{margin:0;background:#fff;color:#1a1a1a;font:16px/1.4 Arial,Helvetica,sans-serif}
main{padding:16px}
#clip{font-size:32px;font-weight:700;background:linear-gradient(90deg,#c00,#00c);-webkit-background-clip:text;background-clip:text;color:transparent}
</style></head><body>
<main><p id="clip">Gradient text</p></main>
</body></html>
