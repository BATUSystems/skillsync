<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>a11y modern colours</title>
<style>
html,body{margin:0;background:#fff;color:#1a1a1a;font:16px/1.4 Arial,Helvetica,sans-serif}
main{padding:16px}
p{margin:0 0 8px}
#oklch-dark{color:oklch(0.35 0.08 250)}
#oklch-pale{color:oklch(0.88 0.04 250)}
#lab-dark{color:lab(25 0 0)}
#hsl-pale{color:hsl(200 20% 80%)}
#p3-dark{color:color(display-p3 0.1 0.1 0.3)}
</style></head><body>
<main>
<p id="oklch-dark">oklch dark</p><p id="oklch-pale">oklch pale</p><p id="lab-dark">lab dark</p><p id="hsl-pale">hsl pale</p><p id="p3-dark">display-p3 dark</p>
</main>
</body></html>
