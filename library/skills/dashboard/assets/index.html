<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Status przebiegu</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/theme.js"></script>
</head>
<body>
<svg width="0" height="0" class="sprite" aria-hidden="true">
  <symbol id="i-spec" viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 2v6h6M9 13h8M9 17h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-plan" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="5" cy="18" r="1.6" fill="currentColor"/></symbol>
  <symbol id="i-run" viewBox="0 0 24 24"><path d="M12 15l-3-3c1-4 4-8 11-9-1 7-5 10-9 11zM9 12H5l2-4h4M12 15v4l4-2v-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M6 16c-2 1-2 4-2 4s3 0 4-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.3L4 9M4 13a8 8 0 0 0 14.3 4.3L20 15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 4v5h5M20 20v-5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-branch" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="6" cy="19" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6 7.2v9.6M18 10.2c0 4-6 3-11.2 6.6" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-proto" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 8h18M8 21h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="6" cy="6" r=".9" fill="currentColor"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true"><svg><use href="#i-run"/></svg></div>
    <div class="brand-text">
      <h1 id="title">Wczytuję status…</h1>
      <div class="meta" id="meta"></div>
    </div>
  </div>
  <div class="top-right">
    <button id="themeBtn" class="btn theme-btn" type="button" aria-label="Przełącz motyw jasny/ciemny" data-tip="Motyw jasny/ciemny (klawisz T)">
      <svg class="ic i-moon" aria-hidden="true"><use href="#i-moon"/></svg><svg class="ic i-sun" aria-hidden="true"><use href="#i-sun"/></svg>
    </button>
    <span id="live" class="live is-connecting" role="status" aria-live="polite" data-tip="Łączę z serwerem statusu…">
      <span class="live-dot"></span><span class="live-text">Łączę…</span>
    </span>
    <div class="plan-pick">
      <button id="planBtn" class="btn" aria-haspopup="listbox" aria-expanded="false" data-tip="Wybierz plan (domyślnie: bieżący w realizacji)">
        <svg class="ic"><use href="#i-plan"/></svg><span id="planBtnText">Plan</span><svg class="ic chev"><use href="#i-chev"/></svg>
      </button>
      <ul id="planMenu" class="menu" role="listbox" hidden></ul>
    </div>
  </div>
</header>

<div id="waitBanner" class="wait" role="status" aria-live="polite" hidden></div>

<nav class="tabs" role="tablist" aria-label="Widok">
  <button role="tab" id="tab-progress" aria-controls="view-progress" aria-selected="true" data-tip="Akty, postęp i checkpointy (klawisz P)">
    <svg class="ic"><use href="#i-run"/></svg>Postęp
  </button>
  <button role="tab" id="tab-docs" aria-controls="view-docs" aria-selected="false" data-tip="Spec, plan i pliki przebiegu (klawisz D)">
    <svg class="ic"><use href="#i-doc"/></svg>Dokumenty <span class="count" id="docCount"></span>
  </button>
  <span id="protoLink" class="tab-extra" hidden></span>
</nav>

<main>
  <section id="view-progress" role="tabpanel" aria-labelledby="tab-progress">
    <div class="acts" id="acts">
      <div class="act skeleton"></div><div class="act skeleton"></div><div class="act skeleton wide"></div>
    </div>
    <div class="work">
      <div class="phases" id="phases"></div>
      <aside class="feed-box" aria-labelledby="feedTitle">
        <h2 id="feedTitle" data-desc="checkpoints" tabindex="0"><svg class="ic"><use href="#i-flag"/></svg>Ostatnie checkpointy</h2>
        <ol class="feed" id="feed"></ol>
      </aside>
    </div>
  </section>

  <section id="view-docs" role="tabpanel" aria-labelledby="tab-docs" hidden>
    <div class="docs">
      <nav class="doc-list" id="docList" aria-label="Dokumenty zadania"></nav>
      <article class="doc-view" id="docView" aria-live="polite">
        <div class="empty">Wybierz dokument z listy po lewej. Podgląd odświeża się sam, gdy plik się zmieni.</div>
      </article>
    </div>
  </section>
</main>

<footer class="foot" id="foot"></footer>
<script src="/assets/app.js"></script>
<div id="descTip" class="desc-tip" role="tooltip" hidden></div>
</body>
</html>
