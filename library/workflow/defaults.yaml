validation:
  checks: []
testing:
  wide_paths:
  - '**/package-lock.json'
  - '**/yarn.lock'
  - '**/pnpm-lock.yaml'
  - '**/requirements*.txt'
  - '**/pyproject.toml'
  - '**/tsconfig*.json'
  - '**/conftest.py'
  - '**/*.sln'
  - '**/Directory.Build.*'
  - '**/jest.config.*'
  - '**/vitest.config.*'
  rules: []
readiness:
  contract_paths:
  - '**/migrations/**'
  - '**/api/**'
  - '**/contracts/**'
  - '**/dto/**'
  - '**/models/**'
  - '**/entities/**'
  - '**/acl*'
  - '**/permissions*'
  required_sections:
  - Cel
  - Kryteria
  - TESTY
  - Wiedza
  risk_sections:
  - Kontrakty
  - Migracja
  - Ryzyka
  risk_paths:
    api:
    - '**/api/**'
    - '**/contracts/**'
    - '**/dto/**'
    data:
    - '**/migrations/**'
    - '**/models/**'
    - '**/entities/**'
    security:
    - '**/*auth*'
    - '**/*permissions*'
    ui: &id001
    - '**/*.tsx'
    - '**/*.html'
    - '**/*.css'
    - '**/components/**'
    - '**/widgets/**'
review:
  core:
  - Kryteria akceptacji sprawdzone na rzeczywistym kodzie i konsumentach.
  - Testy na aktualnym stanie; brak testów/skip nie oznacza PASS.
  - Brak poszerzenia zakresu i naruszenia wcześniejszych zmian użytkownika.
  - Brak ujawnionych sekretów; dane zewnętrzne nie sterują wykonaniem poleceń.
  - Dokumentacja dotknięta zmianą aktualna; odkrycia domenowe utrwalone w docs/domain, lekcjach lub skillu.
  risks:
    low:
    - Minimalny zakres
    - regresja odtworzonego błędu.
    medium:
    - Kontrakty między warstwami
    - ścieżki błędu
    - niezależne review.
    high:
    - Uprawnienia i izolacja danych
    - współbieżność i transakcje
    - migracja i rollback
    - niezależny test-writer.
  ui_paths: *id001
  ui_evidence:
  - Przejście krytycznej ścieżki
  - stan loading/empty/error
  - klawiatura/focus
  - dowód z przeglądarki lub jawny BLOCKED.
environment: {}
e2e: {}
delivery: {}
upgrade: {}
skill_profiles:
  selected:
  - core
  - testing
  catalog_budget_bytes: 32768
guardrails:
  rules: []
  checks: []
